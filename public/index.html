<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MISTI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="logo">M</span>MISTI<small>EU &middot; ZDR</small></div>
    <button id="new" type="button">New chat</button>
    <button id="health" type="button">Health</button>
    <span id="health-status"></span>
    <span class="spacer"></span>
    <span id="cost" class="pill">0,00 Ft</span>
  </header>

  <main id="log">
    <div class="hint">
      <h2>How can I help?</h2>
      <p>Ask anything, or drop documents (.docx, .pdf) and images to chat about them.
        Paste screenshots with Ctrl+V. Sent to Mistral EU statelessly; nothing is stored.</p>
    </div>
  </main>

  <footer>
    <form id="form" class="composer">
      <div id="docs"></div>
      <textarea id="input" rows="2" placeholder="Message MISTI..."></textarea>
      <div class="bar">
        <button id="attach" type="button">+ Attach</button>
        <input id="file" type="file" accept=".docx,.pdf,image/png,image/jpeg,image/webp,image/gif" multiple hidden>
        <span class="spacer"></span>
        <span class="keys">Enter to send &middot; Shift+Enter for newline</span>
        <button id="send" type="submit" class="primary">Send</button>
      </div>
    </form>
  </footer>

  <script src="/md.js"></script>
  <script src="/img.js"></script>
  <script src="/money.js"></script>
  <script src="/app.js"></script>
</body>
</html>
